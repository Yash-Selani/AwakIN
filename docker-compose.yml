version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: awakin_db
    restart: always
    environment:
      POSTGRES_USER: awakin_user
      POSTGRES_PASSWORD: awakin_password
      POSTGRES_DB: awakin_db
    ports:
      - "5432:5432"
    volumes:
      - awakin_pgdata:/var/lib/postgresql/data

  backend:
    build: 
      context: ./backend
    container_name: awakin_backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      - db
    # Commented out volume for production, uncomment for dev if needed
    # volumes:
    #   - ./backend:/app

volumes:
  awakin_pgdata:
